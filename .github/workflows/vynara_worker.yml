steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  # Step 1: Check GitHub Actions Cache (Restores in ~3s on Run 2+)
  - name: Restore Blender Cache
    id: blender-cache
    uses: actions/cache@v4
    with:
      path: /opt/blender
      key: blender-4.2-linux-x64

  # Step 2: Download ONLY on first run (Skipped on all future runs)
  - name: Download Blender Binary
    if: steps.blender-cache.outputs.cache-hit != 'true'
    run: |
      sudo mkdir -p /opt/blender
      curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz | sudo tar -xJ --strip-components=1 -C /opt/blender

  # Step 3: Run directly from cached binary safely
  - name: Execute Blender Python Script
    env:
      BPY_SCRIPT: ${{ github.event.client_payload.bpy_script }}
      ASSET_ID: ${{ github.event.client_payload.asset_id }}
      W1_HERO: ${{ github.event.client_payload.w1HeroScript }}
      W2_ENV: ${{ github.event.client_payload.w2EnvScript }}
      W3_LIGHT: ${{ github.event.client_payload.w3LightScript }}
    run: |
      mkdir -p output
      
      # Write the Python script using Base64 decode and syntax validation
      python3 - << 'EOF'
      import json, os, sys, re, base64, py_compile

      event_path = os.environ.get('GITHUB_EVENT_PATH')
      bpy_script = ''
      w1 = ''
      w2 = ''
      w3 = ''

      if event_path and os.path.exists(event_path):
          try:
              with open(event_path, 'r', encoding='utf-8') as ef:
                  event_data = json.load(ef)
                  payload = event_data.get('client_payload', {})
                  
                  # Check for Base64 payload first (immune to quote-stripping)
                  if 'bpy_script_b64' in payload and payload['bpy_script_b64'].strip():
                      bpy_script = base64.b64decode(payload['bpy_script_b64']).decode('utf-8', errors='ignore')
                  elif 'bpy_script' in payload:
                      candidate = payload['bpy_script'].strip()
                      if candidate.startswith('b64:'):
                          bpy_script = base64.b64decode(candidate[4:]).decode('utf-8', errors='ignore')
                      else:
                          bpy_script = candidate
                          
                  w1 = payload.get('w1HeroScript', '')
                  w2 = payload.get('w2EnvScript', '')
                  w3 = payload.get('w3LightScript', '')
          except Exception as e:
              print(f"Note on GITHUB_EVENT_PATH read: {e}")

      # Fallback to environment variables if event file reading is unavailable
      if not bpy_script:
          env_s = os.environ.get('BPY_SCRIPT', '').strip()
          if env_s.startswith('b64:'):
              try:
                  bpy_script = base64.b64decode(env_s[4:]).decode('utf-8', errors='ignore')
              except Exception:
                  bpy_script = env_s
          else:
              bpy_script = env_s

      if not w1: w1 = os.environ.get('W1_HERO', '')
      if not w2: w2 = os.environ.get('W2_ENV', '')
      if not w3: w3 = os.environ.get('W3_LIGHT', '')

      # If modular sub-scripts are passed separately, assemble them
      if not bpy_script.strip() and (w1.strip() or w2.strip() or w3.strip()):
          bpy_script = (
              "import bpy, os, math, random, sys\n"
              "import addon_utils\n\n"
              "try:\n"
              "    addon_utils.enable('archimesh')\n"
              "    addon_utils.enable('rigify')\n"
              "except Exception as e: print(f'Addon note: {e}')\n\n"
              "os.makedirs('output', exist_ok=True)\n"
              "bpy.ops.object.select_all(action='SELECT')\n"
              "bpy.ops.object.delete(use_global=False)\n\n"
              f"{w1}\n\n{w2}\n\n{w3}\n"
          )

      # Fail fast if payload is completely empty
      if not bpy_script.strip():
          err_msg = "FATAL ERROR: No Blender Python script provided in payload."
          print(err_msg)
          with open('output/error.txt', 'w', encoding='utf-8') as ef:
              ef.write(err_msg + '\n')
          sys.exit(1)

      # Auto-Repair 1: Fix unquoted node lookups (e.g. nodes.get(Principled BSDF) -> nodes.get("Principled BSDF"))
      bpy_script = re.sub(r'nodes\.get\(\s*([A-Za-z0-9_ ]+)\s*\)', lambda m: f'nodes.get("{m.group(1).strip()}")' if '"' not in m.group(1) and "'" not in m.group(1) else m.group(0), bpy_script)

      # Auto-Repair 2: Fix unquoted f-strings (e.g. fPool_LED_{i} -> f"Pool_LED_{i}")
      bpy_script = re.sub(r'(?<=[=\s,(])f([a-zA-Z0-9_]+\{[^}"\n]+\}[a-zA-Z0-9_]*)', r'f"\1"', bpy_script)

      # Auto-Repair 3: Fix hallucinated Blender operators (_create instead of _add)
      bpy_script = bpy_script.replace(".primitive_cube_create(", ".primitive_cube_add(")
      bpy_script = bpy_script.replace(".primitive_plane_create(", ".primitive_plane_add(")
      bpy_script = bpy_script.replace(".primitive_cylinder_create(", ".primitive_cylinder_add(")
      bpy_script = bpy_script.replace(".primitive_cone_create(", ".primitive_cone_add(")
      bpy_script = bpy_script.replace(".primitive_uv_sphere_create(", ".primitive_uv_sphere_add(")

      # Ensure an active camera exists if render is invoked
      if 'bpy.ops.render.render' in bpy_script:
          camera_safeguard = (
              "\n\n# Workflow Camera Safeguard\n"
              "try:\n"
              "    import math\n"
              "    if not bpy.context.scene.camera:\n"
              "        _cam_data = bpy.data.cameras.new('WorkflowCamera')\n"
              "        _cam_data.lens = 45.0\n"
              "        _cam_obj = bpy.data.objects.new('Camera', _cam_data)\n"
              "        bpy.context.collection.objects.link(_cam_obj)\n"
              "        bpy.context.scene.camera = _cam_obj\n"
              "        _cam_obj.location = (0, -16, 9)\n"
              "        _cam_obj.rotation_euler = (math.radians(65), 0, 0)\n"
              "except Exception as _ce: print(f'Camera safeguard note: {_ce}')\n"
          )
          if 'bpy.ops.export_scene.gltf' in bpy_script:
              idx = bpy_script.find('bpy.ops.export_scene.gltf')
              bpy_script = bpy_script[:idx] + camera_safeguard + "\n" + bpy_script[idx:]
          else:
              bpy_script += camera_safeguard

      # Ensure standardized GLTF/GLB export command exists
      if 'export_scene.gltf' not in bpy_script:
          bpy_script += (
              "\n\n# Standard Model Exporter\n"
              "import bpy, os\n"
              "os.makedirs('output', exist_ok=True)\n"
              "try:\n"
              "    bpy.ops.export_scene.gltf(filepath='output/model.glb', export_format='GLB', export_skins=True, export_animations=True)\n"
              "    print('3D GLTF Export Successful: output/model.glb')\n"
              "except Exception as ge: print(f'GLTF export warning: {ge}')\n"
          )

      with open('run_task.py', 'w', encoding='utf-8') as f:
          f.write(bpy_script)

      # Pre-compile syntax check
      try:
          py_compile.compile('run_task.py', doraise=True)
          print("Python Syntax Pre-Check: PASSED")
      except py_compile.PyCompileError as pe:
          print(f"Syntax Validation Warning: {pe}")

      EOF

      # Run headless Blender and capture full execution log
      /opt/blender/blender -b -P run_task.py 2>&1 | tee output/blender_execution.log || true

      # Verify output files and log failures with terminal context
      if [ -f output/model.glb ]; then
        echo "SUCCESS: model.glb generated successfully."
        exit 0
      else
        echo "ERROR: Blender failed to output model.glb" > output/error.txt
        echo "--- TERMINAL TRACEBACK ---" >> output/error.txt
        tail -n 40 output/blender_execution.log >> output/error.txt
        exit 1
      fi

  # Step 4: Upload both GLB model, Cycles render, and execution logs (Runs even if Step 3 fails)
  - name: Upload Finished Model and Render Preview
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: ${{ github.event.client_payload.asset_id || 'vynara-artifact' }}
      path: output/
      if-no-files-found: warn